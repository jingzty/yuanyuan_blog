  <style>
    /* --- Collapsible metadata toggle --- */
    .metadata-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 0.85rem;
      color: var(--ink-muted);
      cursor: pointer;
      padding: var(--space-sm) 0;
      margin-bottom: var(--space-md);
      user-select: none;
      transition: color var(--duration) var(--ease);
    }
    .metadata-toggle:hover {
      color: var(--ink);
    }
    .metadata-toggle .toggle-arrow {
      display: inline-block;
      transition: transform var(--duration) var(--ease);
      font-size: 0.7rem;
    }
    .metadata-toggle.collapsed .toggle-arrow {
      transform: rotate(-90deg);
    }
    .metadata-body {
      overflow: hidden;
      transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease), margin 0.35s var(--ease);
      max-height: 600px;
      opacity: 1;
    }
    .metadata-body.collapsed {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0;
    }

    /* --- Cover image upload area --- */
    .cover-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      cursor: pointer;
      transition: all var(--duration) var(--ease);
      background: var(--paper);
      position: relative;
    }
    .cover-upload-area:hover {
      border-color: var(--sky);
      background: var(--paper-deep);
    }
    .cover-upload-area .upload-icon {
      font-size: 2rem;
      color: var(--ink-muted);
      margin-bottom: var(--space-sm);
    }
    .cover-upload-area p {
      font-size: 0.85rem;
      color: var(--ink-muted);
    }
    .cover-upload-area.has-preview {
      padding: 0;
      border-style: solid;
      overflow: hidden;
    }
    .cover-upload-area.has-preview img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }
    .cover-upload-area .remove-cover {
      display: none;
    }
    .cover-upload-area.has-preview .remove-cover {
      display: flex;
      position: absolute;
      top: var(--space-sm);
      right: var(--space-sm);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(26, 26, 28, 0.7);
      color: var(--white);
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 2;
    }
    .cover-upload-area.has-preview .upload-placeholder {
      display: none;
    }

    /* --- Toolbar button active state --- */
    .editor-toolbar button:active {
      background: var(--paper-deep);
    }
    .editor-toolbar button.toolbar-active {
      background: var(--paper);
      color: var(--coral);
    }

    /* --- Line numbers on textarea --- */
    .editor-wrap {
      position: relative;
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .editor-line-numbers {
      width: 48px;
      flex-shrink: 0;
      padding: var(--space-lg) 0;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--ink-muted);
      background: var(--paper);
      border-right: 1px solid var(--border);
      user-select: none;
      overflow: hidden;
    }
    .editor-line-numbers span {
      display: block;
      padding-right: var(--space-sm);
    }
    .editor-textarea {
      flex: 1;
      padding: var(--space-lg);
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--ink);
      background: var(--white);
      tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* --- Editor actions bar --- */
    .editor-actions {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-lg);
      padding-top: var(--space-lg);
      border-top: 1px solid var(--border);
    }

    /* --- Inline preview image --- */
    .editor-preview a {
      color: var(--sky-deep);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .editor-preview a:hover {
      color: var(--coral);
    }
    .editor-preview img {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin: var(--space-lg) 0;
    }
    .editor-preview strong {
      font-weight: 700;
    }
    .editor-preview em {
      font-style: italic;
    }
    .editor-preview table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: var(--space-lg);
    }
    .editor-preview th,
    .editor-preview td {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--border);
      text-align: left;
    }
    .editor-preview th {
      background: var(--paper);
      font-weight: 600;
    }

    /* --- Responsive: editor --- */
    @media (max-width: 900px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
      .editor-pane:first-child {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .editor-container {
        min-height: auto;
      }
      .editor-pane {
        min-height: 400px;
      }
    }
  </style>

  <script>
    // ============================================
    // Sample markdown content
    // ============================================
    const sampleContent = `# 在京都的巷弄里，遇见秋天

京都的秋天，藏在每一条古老的巷弄里。红叶、寺院、茶香，还有那些不经意的相遇，都是旅途中最美的风景。

## 第一站：岚山的清晨

清晨六点，当第一缕阳光穿过竹林的缝隙，岚山才刚刚苏醒。我沿着**竹林小径**缓步前行，耳边只有风穿过竹叶的簌簌声。

> 在京都，时间变得很慢，慢到你可以听见自己的呼吸。

竹林深处藏着一座小小的寺院——*常寂光寺*。门口的枫叶正红得热烈，像是为每一位到访者铺开的红毯。

### 竹林漫步小贴士

- 建议清晨 7 点前到达，避开人流高峰
- 竹林小径全程约 500 米，步行约 15 分钟
- 记得带上相机，清晨的光线最适合拍照

## 第二站：哲学之道

哲学之道是一条沿着运河的小路，两旁种满了樱花树。虽然秋天没有樱花，但红叶同样美得让人心醉。

\`\`\`
从银阁寺出发
沿着运河南下
经过法然院
最终抵达南禅寺
全程约 2 公里
\`\`\`

走在哲学之道上，你会看到：

1. 两岸的红叶倒映在水面上
2. 悠闲散步的猫咪
3. 路边古色古香的茶屋
4. 偶尔经过的和服身影

## 第三站：祇园的黄昏

傍晚时分，祇园的花见小路渐渐亮起了灯笼。空气中飘着淡淡的茶香和木屐叩击石板路的声响，仿佛穿越回了百年前的京都。

---

### 旅行小记

在京都的五天里，我学会了放慢脚步，用一杯抹茶的时间去感受这座城市。如果你也计划去京都，不妨试试 \`慢旅行\` 的方式——不求打卡多少景点，只求在每一个停留的地方，都能找到属于自己的宁静。

**[点击查看完整游记](https://example.com/kyoto-travel)**

![京都秋色](https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800)
`;

    // ============================================
    // DOM references
    // ============================================
    const textarea = document.getElementById('editorTextarea');
    const preview = document.getElementById('editorPreview');
    const lineNumbers = document.getElementById('lineNumbers');

    // ============================================
    // Initialize
    // ============================================
    textarea.value = sampleContent;
    updatePreview();
    updateLineNumbers();

    // ============================================
    // Metadata toggle
    // ============================================
    function toggleMetadata() {
      const toggle = document.getElementById('metadataToggle');
      const body = document.getElementById('metadataBody');
      toggle.classList.toggle('collapsed');
      body.classList.toggle('collapsed');
    }

    // ============================================
    // Cover image upload
    // ============================================
    function handleCoverUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const area = document.getElementById('coverUpload');
        let img = area.querySelector('img');
        if (!img) {
          img = document.createElement('img');
          img.alt = '封面预览';
          area.insertBefore(img, area.firstChild);
        }
        img.src = e.target.result;
        area.classList.add('has-preview');
      };
      reader.readAsDataURL(file);
    }

    function removeCover(event) {
      event.stopPropagation();
      const area = document.getElementById('coverUpload');
      const img = area.querySelector('img');
      if (img) img.remove();
      area.classList.remove('has-preview');
      document.getElementById('coverInput').value = '';
    }

    // ============================================
    // Line numbers
    // ============================================
    function updateLineNumbers() {
      const lines = textarea.value.split('\n');
      const count = Math.max(lines.length, 1);
      let html = '';
      for (let i = 1; i <= count; i++) {
        html += '<span>' + i + '</span>';
      }
      lineNumbers.innerHTML = html;
    }

    function syncScroll() {
      lineNumbers.scrollTop = textarea.scrollTop;
    }

    // ============================================
    // Markdown to HTML parser
    // ============================================
    function parseMarkdown(md) {
      let html = md;

      // Escape HTML entities
      html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Code blocks (```) - must be before inline code
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
        // Unescape inside code blocks
        code = code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        return '<pre><code>' + code + '</code></pre>';
      });

      // Inline code (`)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Horizontal rules
      html = html.replace(/^(---|\*\*\*|___)$/gm, '<hr>');

      // Blockquotes - handle multi-line
      html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
      // Merge consecutive blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

      // Bold and Italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // Images
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

      // Links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Ordered lists
      html = html.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
        return '<ol>\n' + match + '</ol>\n';
      });

      // Unordered lists
      html = html.replace(/^-\s(.+)$/gm, '<li>$1</li>');
      // Wrap consecutive <li> in <ul>
      html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
        // Skip if already inside <ol>
        if (match.indexOf('<ol>') === -1) {
          return '<ul>\n' + match + '</ul>\n';
        }
        return match;
      });

      // Paragraphs - wrap remaining text lines in <p>
      // Split by double newlines
      const blocks = html.split(/\n\n+/);
      html = blocks.map(function(block) {
        block = block.trim();
        if (!block) return '';

        // Skip blocks that are already wrapped in block-level tags
        if (/^<(h[1-6]|ul|ol|pre|blockquote|hr|li|img|table)/.test(block)) {
          // Handle single <li> items that aren't wrapped in list
          if (/^<li>/.test(block) && !/^<(ul|ol)>/.test(block)) {
            return '<ul>' + block + '</ul>';
          }
          return block;
        }

        // Handle single lines
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n\n');

      return html;
    }

    // ============================================
    // Live preview
    // ============================================
    function updatePreview() {
      const md = textarea.value;
      preview.innerHTML = parseMarkdown(md);
      updateLineNumbers();
    }

    // ============================================
    // Toolbar: Insert markdown
    // ============================================
    function insertMarkdown(before, after, placeholder) {
      const ta = textarea;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const selectedText = ta.value.substring(start, end);

      let insertion;
      if (selectedText) {
        insertion = before + selectedText + after;
      } else {
        insertion = before + placeholder + after;
      }

      ta.focus();
      document.execCommand('insertText', false, insertion);

      // Select the placeholder text if no text was selected
      if (!selectedText) {
        const newStart = start + before.length;
        const newEnd = newStart + placeholder.length;
        ta.setSelectionRange(newStart, newEnd);
      }

      updatePreview();
    }

    function insertHeading() {
      const ta = textarea;
      const start = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf('\n', start - 1) + 1;
      const lineEnd = ta.value.indexOf('\n', start);
      const actualEnd = lineEnd === -1 ? ta.value.length : lineEnd;
      const currentLine = ta.value.substring(lineStart, actualEnd);

      let headingLevel = 3;
      if (/^### /.test(currentLine)) headingLevel = 1;
      else if (/^## /.test(currentLine)) headingLevel = 3;
      else if (/^# /.test(currentLine)) headingLevel = 2;

      const prefix = '#'.repeat(headingLevel) + ' ';

      ta.focus();
      ta.setSelectionRange(lineStart, actualEnd);
      document.execCommand('insertText', false, prefix + currentLine.replace(/^#+ /, ''));
      updatePreview();
    }

    function insertCodeBlock() {
      const ta = textarea;
      const start = ta.selectionStart;
      const selectedText = ta.value.substring(ta.selectionStart, ta.selectionEnd);

      let insertion;
      if (selectedText) {
        insertion = '\n```\n' + selectedText + '\n```\n';
      } else {
        insertion = '\n```\n代码块\n```\n';
      }

      ta.focus();
      document.execCommand('insertText', false, insertion);

      if (!selectedText) {
        const newStart = start + 5;
        const newEnd = newStart + 3;
        ta.setSelectionRange(newStart, newEnd);
      }

      updatePreview();
    }

    function insertList(prefix) {
      const ta = textarea;
      const start = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf('\n', start - 1) + 1;

      // Get current line content
      let lineEnd = ta.value.indexOf('\n', start);
      if (lineEnd === -1) lineEnd = ta.value.length;
      const currentLine = ta.value.substring(lineStart, lineEnd);

      // If there's selected text, prefix each line
      const selectedText = ta.value.substring(ta.selectionStart, ta.selectionEnd);
      if (selectedText && ta.selectionStart !== ta.selectionEnd) {
        const lines = selectedText.split('\n');
        const listItems = lines.map(function(l) { return prefix + l; }).join('\n');
        ta.focus();
        document.execCommand('insertText', false, listItems);
        updatePreview();
        return;
      }

      ta.focus();
      ta.setSelectionRange(lineStart, lineStart);
      document.execCommand('insertText', false, prefix + currentLine);
      updatePreview();
    }

    // ============================================
    // Keyboard shortcuts
    // ============================================
    function handleEditorKeydown(e) {
      // Ctrl+S / Cmd+S - Save
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveArticle();
        return;
      }

      // Tab - insert spaces
      if (e.key === 'Tab') {
        e.preventDefault();
        const ta = textarea;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
        updatePreview();
        return;
      }
    }

    // ============================================
    // Save article
    // ============================================
    function saveArticle() {
      const title = document.getElementById('articleTitle').value.trim();
      if (!title) {
        showToast('请输入文章标题', 'error');
        return;
      }

      const articleData = {
        title: title,
        category: document.getElementById('articleCategory').value,
        summary: document.getElementById('articleSummary').value.trim(),
        content: textarea.value,
        savedAt: new Date().toISOString()
      };

      // In a real app, this would send to a server
      // For now, store in localStorage
      try {
        const articles = JSON.parse(localStorage.getItem('yytsky_articles') || '[]');
        articles.push(articleData);
        localStorage.setItem('yytsky_articles', JSON.stringify(articles));
        showToast('文章已保存成功', 'success');
      } catch (e) {
        showToast('保存失败，请重试', 'error');
      }
    }

    // ============================================
    // Toast
    // ============================================
    function showToast(message, type) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + (type === 'error' ? 'error' : 'success');
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(function() {
          toast.remove();
        }, 300);
      }, 2500);
    }

    // ============================================
    // Navigation
    // ============================================
    function goBack() {
      window.location.href = 'admin-categories.html';
    }

    // ============================================
    // Global keyboard shortcut
    // ============================================
    document.addEventListener('keydown', function(e) {
      // Ctrl+S anywhere on the page
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveArticle();
      }
    });
  </script>
</body>
</html>
