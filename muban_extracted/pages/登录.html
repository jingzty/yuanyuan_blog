<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 远远的天空</title>
    <style id="theme-vars">
/* Yuanyuan Blog — Brand CSS (based on Doubao Design Library)
   Tone: 清新简约, soft sky-blue accents, calm reading surface
*/
:root {
  /* === Brand palette === */
  --color-primary: #0065fd;
  --color-primary-foreground: #ffffff;
  --color-primary-soft: #e5e9ff;
  --color-primary-deep: #00266b;

  /* === Surfaces === */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* === Semantic === */
  --secondary: #eff1f4;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #e5e9ff;
  --accent-foreground: #00266b;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;
  --border: #e7eaef;
  --input: #e7eaef;
  --ring: #557fff;

  /* === Chart === */
  --chart-1: #557fff;
  --chart-2: #0065fd;
  --chart-3: #0057da;
  --chart-4: #0043ad;
  --chart-5: #002e7d;

  /* === Sidebar === */
  --sidebar: #eff1f4;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #0065fd;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #d4daff;
  --sidebar-accent-foreground: #00266b;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #0065fd;

  /* === Typography === */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Stack Sans Text", ui-sans-serif, sans-serif, system-ui;
  --font-serif: "Source Serif 4", "Songti SC", serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* === Radius === */
  --radius: 1.2rem;
  --radius-sm: 0.4rem;
  --radius-md: 0.8rem;
  --radius-lg: 1.2rem;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-2xs: 0 1px 0px 0px rgb(14 17 21 / 0);
  --shadow-xs: 0 1px 0px 0px rgb(14 17 21 / 0);
  --shadow-sm: 0 1px 0px 0px rgb(14 17 21 / 0), 0 1px 2px -1px rgb(14 17 21 / 0);
  --shadow-md: 0 1px 0px 0px rgb(14 17 21 / 0), 0 2px 4px -1px rgb(14 17 21 / 0);
  --shadow-lg: 0 4px 12px -2px rgb(14 17 21 / 0.06), 0 2px 6px -2px rgb(14 17 21 / 0.04);

  /* === Rhythm === */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
}

/* === Semantic aliases required by fill-html-head.mjs === */
:root {
  --doubao-background: var(--background);
  --doubao-foreground: var(--foreground);
  --doubao-card: var(--card);
  --doubao-card-foreground: var(--card-foreground);
  --doubao-popover: var(--popover);
  --doubao-popover-foreground: var(--popover-foreground);
  --doubao-primary: var(--primary, #0065fd);
  --doubao-primary-foreground: var(--primary-foreground, #ffffff);
  --doubao-secondary: var(--secondary);
  --doubao-secondary-foreground: var(--secondary-foreground);
  --doubao-muted: var(--muted);
  --doubao-muted-foreground: var(--muted-foreground);
  --doubao-accent: var(--accent);
  --doubao-accent-foreground: var(--accent-foreground);
  --doubao-destructive: var(--destructive);
  --doubao-destructive-foreground: var(--destructive-foreground);
  --doubao-border: var(--border);
  --doubao-input: var(--input);
  --doubao-ring: var(--ring);
  --doubao-radius: var(--radius);
}

    </style>

<body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <!-- Background: multi-layer atmospheric gradient from sky-blue to warm morning white -->
    <div class="fixed inset-0 -z-10" style="background: linear-gradient(160deg, #d4e4f7 0%, #eef2f6 38%, #f7f3ea 68%, #f0ece4 100%);"></div>

    <!-- Glow orbs (large blurred radial gradients for depth) -->
    <div class="fixed top-[-200px] right-[-200px] w-[550px] h-[550px] rounded-full pointer-events-none -z-10" style="background: radial-gradient(ellipse at center, rgba(0,101,253,0.08) 0%, transparent 70%);"></div>
    <div class="fixed bottom-[-200px] left-[-200px] w-[500px] h-[500px] rounded-full pointer-events-none -z-10" style="background: radial-gradient(ellipse at center, rgba(0,101,253,0.06) 0%, transparent 70%);"></div>
    <div class="fixed top-[40%] left-[50%] translate-x-[-50%] w-[600px] h-[300px] rounded-full pointer-events-none -z-10" style="background: radial-gradient(ellipse at center, rgba(255,255,255,0.3) 0%, transparent 70%);"></div>

    <!-- SVG Cloud Decorations (very low opacity, pointer-events-none) -->
    <svg class="fixed pointer-events-none -z-10" style="width: 280px; height: 100px; top: 10%; right: 8%; opacity: 0.09;" viewBox="0 0 280 100" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 80 Q15 80 12 62 Q2 58 6 42 Q10 28 30 28 Q35 12 58 12 Q78 12 85 28 Q100 24 110 32 Q125 30 132 45 Q145 48 145 62 Q140 76 125 80 Z"/>
    </svg>
    <svg class="fixed pointer-events-none -z-10" style="width: 200px; height: 75px; bottom: 18%; left: 5%; opacity: 0.06;" viewBox="0 0 280 100" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 80 Q15 80 12 62 Q2 58 6 42 Q10 28 30 28 Q35 12 58 12 Q78 12 85 28 Q100 24 110 32 Q125 30 132 45 Q145 48 145 62 Q140 76 125 80 Z"/>
    </svg>
    <svg class="fixed pointer-events-none -z-10" style="width: 160px; height: 60px; top: 45%; left: 16%; opacity: 0.05;" viewBox="0 0 280 100" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 80 Q15 80 12 62 Q2 58 6 42 Q10 28 30 28 Q35 12 58 12 Q78 12 85 28 Q100 24 110 32 Q125 30 132 45 Q145 48 145 62 Q140 76 125 80 Z"/>
    </svg>

    <main class="min-h-screen flex flex-col">
        <div class="flex-1 flex flex-col items-center justify-center px-4 py-12 sm:py-16">

            <!-- Back to home link -->
            <a href="../index.html" data-dom-id="link-back-home" class="anim-logo text-sm inline-flex items-center gap-1.5 mb-10 transition-colors duration-150 hover:text-foreground" style="color: var(--muted-foreground);">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>返回首页</span>
            </a>

            <!-- Brand Logo -->
            <div class="anim-logo text-center mb-10">
              <div class="flex items-center justify-center w-10 h-10 rounded-full mx-auto mb-3" style="background: var(--color-primary-soft);">
                <i data-lucide="cloud-sun" class="w-5 h-5" style="color: var(--color-primary);"></i>
              </div>
              <h1 class="text-2xl font-semibold tracking-tight" style="color: var(--foreground); font-family: var(--font-sans);">远远的天空</h1>
              <p class="text-sm text-muted-foreground mt-1">登录管理后台</p>
            </div>

            <!-- Login Card -->
            <div data-dom-id="login-form" class="anim-card w-full max-w-[420px]" style="background: var(--card); border-radius: var(--radius-lg); padding: 2.5rem 2.5rem 2rem; box-shadow: var(--shadow-lg);">

                <!-- Username -->
                <div class="relative mb-5">
                    <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" style="color: var(--muted-foreground);"></i>
                    <input data-dom-id="login-username" type="text" placeholder="请输入用户名" autocomplete="username"
                           class="login-input w-full h-12 pl-11 pr-4 text-sm outline-none transition-all duration-150"
                           style="border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
                </div>

                <!-- Password -->
                <div class="relative mb-5">
                    <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" style="color: var(--muted-foreground);"></i>
                    <input data-dom-id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password"
                           class="login-input w-full h-12 pl-11 pr-4 text-sm outline-none transition-all duration-150"
                           style="border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
                </div>

                <!-- Captcha -->
                <div class="flex gap-3 mb-5">
                    <div class="relative flex-1 min-w-0">
                        <i data-lucide="shield-check" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" style="color: var(--muted-foreground);"></i>
                        <input data-dom-id="login-captcha" type="text" placeholder="请输入验证码" autocomplete="off"
                               class="login-input w-full h-12 pl-11 pr-4 text-sm outline-none transition-all duration-150"
                               style="border-radius: var(--radius-md); border: 1px solid var(--input); background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
                    </div>
                    <div data-dom-id="login-captcha-img" class="shrink-0 overflow-hidden" style="width: 120px; height: 48px; border-radius: var(--radius-md); background: linear-gradient(135deg, #a8c8f8 0%, #c8ddf8 30%, #d8e8fa 60%, #b8d4f5 100%); position: relative;">
                        <div style="position: absolute; inset: 0; background: repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(255,255,255,0.35) 14px, rgba(255,255,255,0.35) 15px), repeating-linear-gradient(-30deg, transparent, transparent 20px, rgba(255,255,255,0.2) 20px, rgba(255,255,255,0.2) 21px), repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0,101,253,0.07) 10px, rgba(0,101,253,0.07) 11px);"></div>
                    </div>
                </div>

                <!-- Error Message -->
                <div data-dom-id="login-error" style="display: none; color: var(--destructive);" class="text-sm mb-4">用户名或密码错误，剩余 3 次尝试</div>

                <!-- Login Button -->
                <button data-dom-id="btn-login" type="submit"
                        class="w-full h-12 font-medium text-base cursor-pointer transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0"
                        style="border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-primary-foreground); font-family: var(--font-sans);">登录</button>

                <p class="text-center text-xs mt-5" style="color: var(--muted-foreground);">请输入管理员账号和密码</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="anim-footer text-center py-6">
            <p class="text-xs" style="color: var(--muted-foreground);">&copy; 2026 远远的天空 &middot; 个人博客</p>
        </footer>
    </main>

    <style>
        /* --- Form Input Focus Ring --- */
        .login-input:focus {
            border-color: var(--color-primary) !important;
            box-shadow: 0 0 0 3px rgba(0, 101, 253, 0.12);
        }
        .login-input::placeholder {
            color: var(--muted-foreground);
            opacity: 0.7;
        }

        /* --- Page Load Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .anim-logo   { animation: fadeInDown 0.6s ease-out 0.1s both; }
        .anim-card   { animation: fadeInUp   0.6s ease-out 0.3s both; }
        .anim-footer { animation: fadeIn     0.6s ease-out 0.5s both; }

        @media (prefers-reduced-motion: reduce) {
            .anim-logo,
            .anim-card,
            .anim-footer {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
